<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI';
        }
    
        /* THEME */
        :root {
            --primary: #6c63ff;
            --dark: #1e1e2f;
        }
    
        /* NAV */
        .navbar {
            background: var(--dark);
        }
    
        /* HERO */
        .hero {
            height: 90vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url('https://source.unsplash.com/1600x800/?creative,art');
            background-size: cover;
            background-position: center;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    
        /* CARD */
        .card:hover {
            transform: translateY(-5px);
            transition: 0.3s;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold">Pictoreal</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">☰</button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#events">Events</a></li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                <li class="nav-item"><a class="nav-link">Login</a></li>
                <li class="nav-item"><a class="nav-link">Signup</a></li>
            </ul>
        </div>
    </div>
</nav>
    <div class="container py-5">
        <div class="col-md-6 mx-auto bg-white p-4 rounded shadow">

            <h3 class="text-center mb-3">Event Registration</h3>

            <form id="form" class="needs-validation" novalidate>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" placeholder="Name" required>
                    <label>Name</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" placeholder="Email" required>
                    <label>Email</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="tel" class="form-control" placeholder="Phone" pattern="[0-9]{10}" required>
                    <label>Phone</label>
                </div>

                <div id="dynamic"></div>

                <button class="btn btn-primary w-100">Register</button>

            </form>
        </div>
    </div>
<footer class="text-center text-white p-3" style="background:#1e1e2f;">
    <p>© 2026 Pictoreal Club</p>
</footer>

    <script>
        // Get event
        const eventType = new URLSearchParams(window.location.search).get("event");
        const d = document.getElementById("dynamic");

        if (eventType === "hackathon") {
            d.innerHTML = `
<input type="number" class="form-control mb-2" placeholder="Team Size" required>
<input type="text" class="form-control mb-2" placeholder="Team Name" required>
`;
        }

        if (eventType === "workshop") {
            d.innerHTML = `
<select class="form-select mb-2" required>
<option value="">Select Workshop</option>
<option>Photography</option>
<option>Design</option>
<option>Editing</option>
</select>
`;
        }

        if (eventType === "seminar") {
            d.innerHTML = `
<select class="form-select mb-2" required>
<option value="">Select Topic</option>
<option>Career Growth</option>
<option>AI Trends</option>
<option>Startups</option>
</select>
`;
        }

        // Validation + Alert
        document.getElementById("form").addEventListener("submit", function (e) {
            if (!this.checkValidity()) {
                e.preventDefault();
                this.classList.add("was-validated");
            } else {
                e.preventDefault();
                alert("Registered Successfully!");
                this.reset();
                this.classList.remove("was-validated");
            }
        });
    </script>

</body>

</html>
