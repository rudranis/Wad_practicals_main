<!DOCTYPE html>
<html>

<head>
    <title>User List</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>User Data</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>City</th>
                </tr>
            </thead>

            <tbody id="data"></tbody>
        </table>

    </div>

    <script>

        // Fetch data using AJAX
        fetch('/api/users')
            .then(res => res.json())
            .then(users => {

                let html = '';

                users.forEach(u => {
                    html += `
        <tr>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.city}</td>
        </tr>
        `;
                });

                document.getElementById('data').innerHTML = html;

            })
            .catch(() => {
                document.getElementById('data').innerHTML = "<tr><td colspan='3'>Error loading data</td></tr>";
            });

    </script>

</body>

</html>
