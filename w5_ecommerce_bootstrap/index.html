<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Listing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .sidebar {
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .filter-title {
            font-weight: bold;
            margin-top: 15px;
        }

        /* 🔥 Image Fix */
        .product-img {
            height: 180px;
            width: 100%;
            object-fit: cover;
        }

        /* Equal height cards */
        .card {
            height: 100%;
        }

        @media (max-width: 768px) {
            .sidebar {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container-fluid py-4">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3">
            <div class="sidebar">

                <h5>Filters</h5>

                <div class="filter-title">Category</div>
                <input type="radio" name="category" checked onclick="filterCategory('all')"> All<br>
                <input type="radio" name="category" onclick="filterCategory('electronics')"> Electronics<br>
                <input type="radio" name="category" onclick="filterCategory('fashion')"> Fashion<br>
                <input type="radio" name="category" onclick="filterCategory('home')"> Home<br>

                <div class="filter-title mt-3">Price</div>
                <input type="radio" name="price" checked onclick="filterPrice('all')"> All<br>
                <input type="radio" name="price" onclick="filterPrice('low')"> Under ₹2000<br>
                <input type="radio" name="price" onclick="filterPrice('mid')"> ₹2000 - ₹8000<br>
                <input type="radio" name="price" onclick="filterPrice('high')"> Above ₹8000<br>

            </div>
        </div>

        <!-- PRODUCTS -->
        <div class="col-md-9">
            <h3 class="mb-3">Products</h3>

            <div class="row g-3">

                <!-- PRODUCT -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 product" data-category="electronics" data-price="7999">
                    <div class="card shadow-sm">
                        <img src="https://source.unsplash.com/300x200/?headphones" class="card-img-top product-img">
                        <div class="card-body text-center">
                            <h6>Headphones</h6>
                            <p class="mb-0">₹7,999</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-4 col-lg-3 product" data-category="electronics" data-price="12999">
                    <div class="card shadow-sm">
                        <img src="https://source.unsplash.com/300x200/?smartwatch" class="card-img-top product-img">
                        <div class="card-body text-center">
                            <h6>Smartwatch</h6>
                            <p class="mb-0">₹12,999</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-4 col-lg-3 product" data-category="home" data-price="1999">
                    <div class="card shadow-sm">
                        <img src="https://source.unsplash.com/300x200/?laptop-stand" class="card-img-top product-img">
                        <div class="card-body text-center">
                            <h6>Laptop Stand</h6>
                            <p class="mb-0">₹1,999</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-4 col-lg-3 product" data-category="fashion" data-price="999">
                    <div class="card shadow-sm">
                        <img src="https://source.unsplash.com/300x200/?tshirt" class="card-img-top product-img">
                        <div class="card-body text-center">
                            <h6>T-Shirt</h6>
                            <p class="mb-0">₹999</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-4 col-lg-3 product" data-category="electronics" data-price="2499">
                    <div class="card shadow-sm">
                        <img src="https://source.unsplash.com/300x200/?gaming-mouse" class="card-img-top product-img">
                        <div class="card-body text-center">
                            <h6>Gaming Mouse</h6>
                            <p class="mb-0">₹2,499</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-4 col-lg-3 product" data-category="home" data-price="1500">
                    <div class="card shadow-sm">
                        <img src="https://source.unsplash.com/300x200/?kitchen" class="card-img-top product-img">
                        <div class="card-body text-center">
                            <h6>Kitchen Item</h6>
                            <p class="mb-0">₹1,500</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
    let currentCategory = "all";
    let currentPrice = "all";

    function filterCategory(category) {
        currentCategory = category;
        applyFilters();
    }

    function filterPrice(priceRange) {
        currentPrice = priceRange;
        applyFilters();
    }

    function applyFilters() {
        const products = document.querySelectorAll('.product');

        products.forEach(p => {
            let show = true;

            const category = p.dataset.category;
            const price = parseInt(p.dataset.price);

            if (currentCategory !== "all" && category !== currentCategory) show = false;

            if (currentPrice !== "all") {
                if (currentPrice === "low" && price >= 2000) show = false;
                if (currentPrice === "mid" && (price < 2000 || price > 8000)) show = false;
                if (currentPrice === "high" && price <= 8000) show = false;
            }

            p.style.display = show ? "block" : "none";
        });
    }
</script>

</body>
</html>
