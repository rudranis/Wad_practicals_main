<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f5f5f5;
    }

    h2 {
        text-align: center;
    }

    .table-container {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        padding: 12px;
        text-align: center;
        border: 1px solid #ddd;
    }

    th {
        background-color: #333;
        color: white;
    }

    img {
        width: 80px;
        height: 80px;
        object-fit: cover;
    }

    .pagination {
        margin-top: 20px;
        text-align: center;
    }

    button {
        padding: 8px 15px;
        margin: 5px;
        border: none;
        background-color: #333;
        color: white;
        cursor: pointer;
        border-radius: 5px;
    }

    button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
    }

    /* Responsive */
    @media (max-width: 768px) {
        table, thead, tbody, th, td, tr {
            display: block;
        }

        tr {
            margin-bottom: 15px;
            background: white;
            padding: 10px;
        }

        th {
            display: none;
        }

        td {
            text-align: left;
            padding: 8px;
            position: relative;
        }

        td::before {
            content: attr(data-label);
            font-weight: bold;
            display: block;
        }
    }
</style>
</head>

<body>

<h2>Product Catalog</h2>

<div class="table-container">
    <table id="productTable">
        <thead>
            <tr>
                <th>Product Image</th>
                <th>Product Name</th>
                <th>Price (INR ₹)</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<div class="pagination">
    <button onclick="prevPage()">Previous</button>
    <span id="pageInfo"></span>
    <button onclick="nextPage()">Next</button>
</div>

<script>
    const products = [
        {name:"Wireless Headphones", price:"₹7,999", desc:"Noise-cancelling over-ear headphones.", img:"https://via.placeholder.com/80"},
        {name:"Smartwatch", price:"₹12,999", desc:"Fitness tracking smartwatch.", img:"https://via.placeholder.com/80"},
        {name:"Gaming Mouse", price:"₹2,499", desc:"Ergonomic gaming mouse.", img:"https://via.placeholder.com/80"},
        {name:"Laptop Stand", price:"₹1,999", desc:"Adjustable aluminium stand.", img:"https://via.placeholder.com/80"},
        
        // Extra products for pagination
        {name:"Keyboard", price:"₹3,499", desc:"Mechanical keyboard.", img:"https://via.placeholder.com/80"},
        {name:"Monitor", price:"₹15,999", desc:"24-inch HD monitor.", img:"https://via.placeholder.com/80"},
        {name:"USB Hub", price:"₹999", desc:"Multi-port USB hub.", img:"https://via.placeholder.com/80"},
        {name:"Webcam", price:"₹4,999", desc:"HD webcam.", img:"https://via.placeholder.com/80"},
        {name:"Speaker", price:"₹2,199", desc:"Bluetooth speaker.", img:"https://via.placeholder.com/80"},
        {name:"Tablet", price:"₹18,999", desc:"Android tablet.", img:"https://via.placeholder.com/80"},
        {name:"Power Bank", price:"₹1,299", desc:"10000mAh power bank.", img:"https://via.placeholder.com/80"},
        {name:"Router", price:"₹2,999", desc:"WiFi router.", img:"https://via.placeholder.com/80"}
    ];

    let currentPage = 1;
    const itemsPerPage = 7;

    function displayProducts() {
        const tableBody = document.querySelector("#productTable tbody");
        tableBody.innerHTML = "";

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const paginatedItems = products.slice(start, end);

        paginatedItems.forEach(p => {
            const row = `
                <tr>
                    <td data-label="Image"><img src="${p.img}"></td>
                    <td data-label="Name">${p.name}</td>
                    <td data-label="Price">${p.price}</td>
                    <td data-label="Description">${p.desc}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        updatePagination();
    }

    function updatePagination() {
        const totalPages = Math.ceil(products.length / itemsPerPage);
        document.getElementById("pageInfo").innerText =
            `Page ${currentPage} of ${totalPages}`;

        document.querySelector("button[onclick='prevPage()']").disabled = currentPage === 1;
        document.querySelector("button[onclick='nextPage()']").disabled = currentPage === totalPages;
    }

    function nextPage() {
        const totalPages = Math.ceil(products.length / itemsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            displayProducts();
        }
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            displayProducts();
        }
    }

    displayProducts();
</script>

</body>
</html>
