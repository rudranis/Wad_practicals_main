<!DOCTYPE html>
<html>

<head>
    <title>Product Catalog</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        .container {
            width: 900px;
            margin: 30px auto;
        }

        h2 {
            text-align: center;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Card */
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Product Catalog</h2>

        <div class="grid" id="products"></div>

    </div>

    <script>

        // AJAX fetch
        fetch('/api/products')
            .then(res => res.json())
            .then(data => {

                let html = '';

                data.forEach(p => {
                    html += `
        <div class="card">
            <img src="${p.image}">
            <h3>${p.name}</h3>
            <p class="price">₹${p.price}</p>
        </div>
        `;
                });

                document.getElementById('products').innerHTML = html;

            })
            .catch(() => {
                document.getElementById('products').innerHTML = "Error loading products";
            });

    </script>

</body>

</html>
