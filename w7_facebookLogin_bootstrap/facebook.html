<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Facebook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        body {
            margin: 0;
            background-color: #edf0f5;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* Header */
        .topbar {
            background-color: #3b5998;
            padding: 10px 0;
            color: white;
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            margin-left: 50px;
        }

        .login-form input {
            height: 28px;
            font-size: 12px;
            margin-right: 5px;
        }

        .login-form label {
            font-size: 12px;
        }

        .login-btn {
            height: 28px;
            padding: 2px 10px;
            font-size: 12px;
        }


        /* Main */
        .main {
            margin-top: 40px;
        }


        /* Left side */
        .left-text {
            font-size: 20px;
            color: #0e385f;
            font-weight: bold;
        }

        .network-img {
            margin-top: 20px;
            width: 100%;
        }


        /* Right side */
        .signup-box h2 {
            font-size: 32px;
            font-weight: bold;
        }

        .signup-box p {
            color: #555;
        }


        .form-control {
            margin-bottom: 10px;
        }


        .signup-btn {
            background-color: #5cb85c;
            color: white;
            font-weight: bold;
            width: 150px;
        }

        .signup-btn:hover {
            background-color: #4cae4c;
        }


        /* Footer small text */
        .small-text {
            font-size: 11px;
            color: #777;
        }
    </style>


</head>


<body>


    <!-- Header -->
    <div class="topbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">


            <div class="logo">facebook</div>


            <form class="d-flex align-items-center login-form me-5">
                <div class="me-2">
                    <label>Email or Username</label><br>
                    <input type="text">
                </div>


                <div class="me-2">
                    <label>Password</label><br>
                    <input type="password">
                </div>


                <div class="mt-3">
                    <button class="btn btn-light login-btn">login</button>
                </div>
            </form>


        </div>
    </div>


    <!-- Main -->
    <div class="container main">
        <div class="row">


            <!-- Left -->
            <div class="col-md-6">
                <div class="left-text">
                    Facebook is useless without friends.<br>
                    Make More Friends.
                </div>


                <img src="https://i.imgur.com/9G3ZQ9D.png" class="network-img">
            </div>


            <!-- Right -->
            <div class="col-md-6 signup-box">
                <h2>Create an Account</h2>
                <p>It's free and always will be.</p>


                <form>
                    <div class="row">
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Firstname">
                        </div>
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Lastname">
                        </div>
                    </div>


                    <input type="text" class="form-control" placeholder="Email">
                    <input type="text" class="form-control" placeholder="Re-enter email">
                    <input type="password" class="form-control" placeholder="Password">


                    <input type="text" class="form-control" placeholder="dd/mm/yyyy">


                    <div class="mb-2">
                        <input type="radio" name="gender"> Male
                        <input type="radio" name="gender" class="ms-3"> Female
                    </div>


                    <p class="small-text">
                        By clicking create an account, you agree to our Terms.
                    </p>


                    <button class="btn signup-btn">Signup</button>
                </form>


                <p class="mt-3 small-text">
                    Create a page for you.
                </p>
            </div>


        </div>
    </div>


</body>

</html>
